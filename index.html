<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CS2 回合开始</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d10; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8eaed;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; opacity: .85; letter-spacing: .3px; }
  .player { width: 100%; max-width: 900px; }
  video {
    width: 100%; height: auto; display: block; border-radius: 10px;
    background: #000; box-shadow: 0 8px 30px rgba(0,0,0,.55);
  }
  .hint { font-size: 12px; opacity: .5; text-align: center; margin: 0; }
  a { color: #7aa2f7; }
</style>
</head>
<body>
  <h1>CS2 · 回合开始 8</h1>
  <div class="player">
    <video id="v" controls playsinline preload="metadata" webkit-playsinline>
      <source src="video.mp4" type="video/mp4">
      你的浏览器不支持内嵌播放，<a href="video.mp4">点此打开视频</a>。
    </video>
  </div>
  <p class="hint">若没有自动播放，点一下播放键 · 可全屏</p>
<script>
  var v = document.getElementById('v');
  v.muted = true;
  var p = v.play();
  if (p && p.catch) { p.catch(function () {}); }
</script>
</body>
</html>
